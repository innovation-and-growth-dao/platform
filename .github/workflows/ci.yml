name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # The web build inlines these; values here are placeholders for CI only.
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_APP_NAME: Innovation & Growth DAO

# Note: the end-to-end suites (`pnpm test:e2e`) need a live Postgres + Redis and
# funded Preprod test wallets, so they run in a separate self-hosted environment,
# not in this workflow. See docs/TEST-REPORT.md.
