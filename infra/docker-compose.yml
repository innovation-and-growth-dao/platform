# Local development data services for DRep DAO.
# Usage: docker compose -f infra/docker-compose.yml up -d   (or: pnpm infra:up)
# Credentials here are DEV-ONLY and match .env.example DATABASE_URL / REDIS_URL.

services:
  postgres:
    image: postgres:16-alpine
    container_name: drepdao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: drep
      POSTGRES_PASSWORD: drep
      POSTGRES_DB: drepdao
    ports:
      - "5432:5432"
    volumes:
      - drepdao-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drep -d drepdao"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: drepdao-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - drepdao-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  drepdao-pg-data:
  drepdao-redis-data:
